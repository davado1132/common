<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codex Agency</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --gradient: linear-gradient(135deg, #667eea, #764ba2);
    }
    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      background: #f9fafb;
      color: #333;
      line-height: 1.6;
    }
    header {
      background: var(--gradient);
      color: white;
      padding: 80px 20px;
      text-align: center;
    }
    header h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }
    header p {
      margin-top: 0;
      font-size: 1.2rem;
    }
    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 40px 20px;
    }
    .features {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }
    .feature {
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      padding: 20px;
    }
    .feature h3 {
      margin-top: 0;
      color: #764ba2;
    }
    footer {
      background: #222;
      color: white;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Codex Agency</h1>
    <p>Building modern web experiences with speed and style.</p>
  </header>

  <div class="container">
    <section class="features">
      <div class="feature">
        <h3>Design</h3>
        <p>Sleek layouts and intuitive interfaces crafted for users.</p>
      </div>
      <div class="feature">
        <h3>Development</h3>
        <p>Robust codebases leveraging cutting-edge technologies.</p>
      </div>
      <div class="feature">
        <h3>Deployment</h3>
        <p>From concept to production, we handle the pipeline.</p>
      </div>
    </section>
  </div>

  <footer>
    &copy; 2025 Codex Agency
  </footer>
</body>
</html>
